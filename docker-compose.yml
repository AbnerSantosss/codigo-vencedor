# Stack de produção — Portainer (repositório Git) + Cloudflare Tunnel.
#
# Nenhuma porta é publicada no host: a VPS já roda outras stacks e não há
# disputa por porta. Quem alcança a aplicação é o `cloudflared`, pela rede
# interna desta stack. O banco nunca sai dela.
#
# As variáveis ficam na aba "Environment variables" da stack no Portainer —
# nunca neste arquivo, que é público.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codigovencedor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-codigovencedor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codigovencedor} -d ${POSTGRES_DB:-codigovencedor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco só é visível na rede interna do compose.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-codigovencedor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-codigovencedor}
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Atrás do túnel, sem isto o rate limit enxerga só o IP do cloudflared.
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [interna]
    # Sem "ports": quem publica para a internet é o túnel, não o host.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [api]
    # O token carrega a configuração do túnel criada no painel Zero Trust.
    # No painel, o Public Hostname aponta para http://api:3000 — nome do
    # serviço nesta mesma rede, não IP nem porta do host.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?defina CLOUDFLARE_TUNNEL_TOKEN}
    networks: [interna]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Caminho absoluto no host, fora do clone do repositório: o Portainer
      # reclona o diretório da stack a cada redeploy e levaria os dumps junto.
      - ${BACKUP_DIR:-/opt/codigo-vencedor/backups}:/backups
    networks: [interna]
    # Uma linha por comando: num escalar dobrado (>) do YAML, linha mais
    # indentada preserva a quebra, e "| gzip" numa linha própria vira
    # erro de sintaxe no sh.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U ${POSTGRES_USER:-codigovencedor} -d ${POSTGRES_DB:-codigovencedor} | gzip > /backups/cv-$$(date +%Y%m%d-%H%M).sql.gz
          find /backups -name "cv-*.sql.gz" -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:

networks:
  # O Portainer prefixa com o nome da stack, então não colide com as redes
  # das outras stacks da VPS.
  interna:
